name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do núcleo
        run: pip install xlrd==2.0.2 openpyxl==3.1.5 XlsxWriter==3.2.9 pypdf==6.19.0

      - name: Conferir se docs/py está em dia com o núcleo
        run: python build.py --verificar

      - name: Importar os módulos do núcleo
        run: python -c "import conciliacao, planilhas, gai, exportar, ponte"

      - name: Testar identificação e cruzamentos
        run: python -m unittest -v test_recusas test_sistemas test_benner

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
